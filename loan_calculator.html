<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Loan Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 90vh;
        }
        .calculator-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #e9ecef;
            border-radius: 5px;
            display: none; /* Hidden by default until calculated */
        }
        .result-box h3 {
            margin: 0 0 10px 0;
            color: #333;
            font-size: 18px;
        }
        .result-item {
            margin: 5px 0;
            color: #444;
        }
    </style>
</head>
<body>

    <div class="calculator-card">
        <h2>Business Loan Calculator</h2>
        
        <div class="form-group">
            <label for="principal">Loan Amount (KES):</label>
            <input type="number" id="principal" placeholder="e.g. 50000">
        </div>

        <div class="form-group">
            <label for="rate">Annual Interest Rate (%):</label>
            <input type="number" id="rate" placeholder="e.g. 12" step="0.1">
        </div>

        <div class="form-group">
            <label for="months">Repayment Period (Months):</label>
            <input type="number" id="months" placeholder="e.g. 12">
        </div>

        <button onclick="calculateLoan()">Calculate Repayment</button>

        <div class="result-box" id="resultBox">
            <h3>Summary</h3>
            <div class="result-item" id="monthlyPayment">Monthly Payment: </div>
            <div class="result-item" id="totalInterest">Total Interest: </div>
            <div class="result-item" id="totalPayable">Total Payable: </div>
        </div>
    </div>

    <script>
        function calculateLoan() {
            // 1. Get input values from the user
            let principal = parseFloat(document.getElementById('principal').value);
            let annualRate = parseFloat(document.getElementById('rate').value);
            let months = parseInt(document.getElementById('months').value);

            // 2. Simple validation to make sure fields aren't empty or invalid
            if (isNaN(principal) || isNaN(annualRate) || isNaN(months) || principal <= 0 || months <= 0) {
                alert("Please enter valid positive numbers in all fields.");
                return;
            }

            // 3. Business math calculation (Simple Interest model for easy learning)
            // Total Interest = (Principal * Annual Rate * Time in Years) / 100
            let timeInYears = months / 12;
            let totalInterest = (principal * annualRate * timeInYears) / 100;
            let totalPayable = principal + totalInterest;
            let monthlyPayment = totalPayable / months;

            // 4. Display results on the screen
            document.getElementById('monthlyPayment').innerText = `Monthly Payment: KES ${monthlyPayment.toFixed(2)}`;
            document.getElementById('totalInterest').innerText = `Total Interest: KES ${totalInterest.toFixed(2)}`;
            document.getElementById('totalPayable').innerText = `Total Payable: KES ${totalPayable.toFixed(2)}`;

            // Make the result box visible
            document.getElementById('resultBox').style.display = 'block';
        }
    </script>

</body>
</html>
